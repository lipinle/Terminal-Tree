name: Source snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: da145f5b0799b1958cba09ca95c57c9bb2f3fede
          persist-credentials: false
      - name: Package and encrypt source snapshot
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/snapshot"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD legacy/python .github/workflows/test.yml .github/workflows/crash-test.yml
          openssl rand -hex 32 > "$RUNNER_TEMP/key"
          cat > "$RUNNER_TEMP/public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoOLAt5WBppStDdcK9RF2
          52ya1XKNdIMR6S545zNUGST2qitXEHra4sIAGuqR0KcDYNUZjvB3Dc5mVCYE380D
          citE0nA4Xk4MF0rIi0ntdGBrjd+E1L1iESt38b/SJlRsRP4qbU3VtUtN9StXmF6k
          39cZC798RsD/kpFtH/hSJm1Hqt121kLc/GS0PLFEHDC+O2fyML76iWZ3BVHDRa4g
          PrdHh14y1E3Ny7lKkimeWYcRuXUgeQMgX2Q0YBlAxvEXhfr3fRsog1vFBvAqIGr/
          WQPuL9CBjX+JDQbyaFPLBfQ8iNYPn7zBHC0KemuiMcCBSI1ZxqFcyTsNbIZY/P66
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:"$RUNNER_TEMP/key" -in "$RUNNER_TEMP/source.tar.gz" -out "$RUNNER_TEMP/snapshot/source.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/key" -out "$RUNNER_TEMP/snapshot/key.enc"
          rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/snapshot/
          retention-days: 1
