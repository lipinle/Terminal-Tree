name: Rust port

on:
  push:
    paths:
      - 'rust/**'
      - 'tests/benchmark/**'
      - '.github/workflows/rust.yml'
      - 'src/tree.py'
  pull_request:
    paths:
      - 'rust/**'
      - 'tests/benchmark/**'
      - '.github/workflows/rust.yml'
      - 'src/tree.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test Rust read-only port
        run: |
          command -v gio
          rustc --version
          cargo test --locked --manifest-path rust/Cargo.toml --features native-ops
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree
      - name: Cross-language scan parity and terminal smoke test
        run: |
          python3 tests/benchmark/parity.py --binary rust/target/release/terminal-tree
      - name: Exercise scoped write UI through PTY
        run: python3 tests/benchmark/workspace.py rust/target/release/terminal-tree
      - name: Test secure result channel and preview shell syntax
        run: |
          python3 tests/benchmark/result.py rust/target/release/terminal-tree
          bash -n rust/install-preview.sh
          bash -n rust/integration-preview.sh
      - name: Compare read-only scan and startup with Python
        run: |
          python3 tests/benchmark/scan.py --binary rust/target/release/terminal-tree
      - name: Benchmark verified copy and move
        run: |
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --example operation_benchmark
          python3 tests/benchmark/operations.py rust/target/release/examples/operation_benchmark
      - name: Verify experimental write commands are unavailable
        run: |
          if rust/target/release/terminal-tree --delete /tmp; then
            echo 'Unexpected mutation command accepted'
            exit 1
          fi
          rust/target/release/terminal-tree --version
