name: Rust port

on:
  push:
    branches: ['release-candidate/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned Python compatibility reference
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/tt-python-reference"
          mkdir -p "$reference"
          git fetch --no-tags --depth=1 origin da145f5b0799b1958cba09ca95c57c9bb2f3fede
          git show da145f5b0799b1958cba09ca95c57c9bb2f3fede:legacy/python/src/tree.py > "$reference/tree.py"
          test "$(git hash-object "$reference/tree.py")" = 3101ff8b3fdbbe0561c28a59f915ab751240e8a9
          echo "TT_PYTHON_REFERENCE=$reference" >> "$GITHUB_ENV"
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build and test Rust read-only port
        run: |
          command -v gio
          rustc --version
          cargo test --locked --manifest-path rust/Cargo.toml --features native-ops
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree
      - name: Verify separate native edition builds
        run: |
          set -euo pipefail
          test "$(rust/target/release/terminal-tree --edition)" = standard
          cargo test --locked --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/tt-paranoid-preview" --features native-ops,paranoid-preview --test edition
          cargo build --locked --release --manifest-path rust/Cargo.toml --target-dir "$RUNNER_TEMP/tt-paranoid-preview" --features native-ops,paranoid-preview --bin terminal-tree
          test "$("$RUNNER_TEMP/tt-paranoid-preview/release/terminal-tree" --edition)" = paranoid-preview
          mkdir -p "$RUNNER_TEMP/tt-edition-artifacts"
          tar -C rust/target/release -czf "$RUNNER_TEMP/tt-edition-artifacts/terminal-tree-standard-preview.tar.gz" terminal-tree
          tar -C "$RUNNER_TEMP/tt-paranoid-preview/release" -czf "$RUNNER_TEMP/tt-edition-artifacts/terminal-tree-paranoid-preview.tar.gz" terminal-tree
      - name: Test actual limited filesystem, mount isolation and permissions
        run: bash tests/benchmark/mounted.sh
      - name: Cross-language scan parity and terminal smoke test
        run: |
          python3 tests/benchmark/parity.py --binary rust/target/release/terminal-tree
      - name: Exercise read-only tree navigation through PTY
        run: python3 tests/benchmark/tree_navigation.py rust/target/release/terminal-tree
      - name: Exercise independent dual-pane and tab state through PTY
        run: python3 tests/benchmark/panes_navigation.py rust/target/release/terminal-tree
      - name: Exercise bounded text and hexadecimal previews through PTY
        run: python3 tests/benchmark/preview_ui.py rust/target/release/terminal-tree
      - name: Exercise scoped write UI through PTY
        run: python3 tests/benchmark/workspace.py rust/target/release/terminal-tree
      - name: Exercise copy, move, preview and Trash through PTY
        run: python3 tests/benchmark/ui_transfer.py rust/target/release/terminal-tree
      - name: Exercise batch operations through PTY
        run: python3 tests/benchmark/batch.py rust/target/release/terminal-tree
      - name: Exercise recovery and view controls through PTY
        run: python3 tests/benchmark/ui_tools.py rust/target/release/terminal-tree
      - name: Exercise categorized help in small terminal
        run: python3 tests/benchmark/help.py rust/target/release/terminal-tree
      - name: Test secure result channel and preview shell syntax
        run: |
          python3 tests/benchmark/result.py rust/target/release/terminal-tree
          bash -n rust/install-preview.sh
          bash -n rust/integration-preview.sh
      - name: Verify side-by-side preview installation
        run: python3 tests/benchmark/install_preview.py
      - name: Compare read-only scan and startup with Python
        run: |
          python3 tests/benchmark/scan.py --binary rust/target/release/terminal-tree
      - name: Benchmark verified copy and move
        run: |
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --example operation_benchmark
          # Compare against the last verified worker revision on the same runner.
          git fetch --no-tags --depth=1 origin 4e9baa9807401367d6571c537be0c199b2fa117f
          git worktree add --detach "$RUNNER_TEMP/tt-baseline" FETCH_HEAD
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/tt-baseline/rust/Cargo.toml" --features native-ops --example operation_benchmark
          python3 tests/benchmark/operations.py rust/target/release/examples/operation_benchmark "$RUNNER_TEMP/tt-baseline/rust/target/release/examples/operation_benchmark"
          git worktree remove --force "$RUNNER_TEMP/tt-baseline"
      - name: Measure native resources and navigation on synthetic fixtures
        run: python3 tests/benchmark/resources.py rust/target/release/terminal-tree rust/target/release/examples/operation_benchmark
      - name: Verify experimental write commands are unavailable
        run: |
          if rust/target/release/terminal-tree --delete /tmp; then
            echo 'Unexpected mutation command accepted'
            exit 1
          fi
          rust/target/release/terminal-tree --version
      - name: Upload verified Standard preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-tree-standard-preview
          path: ${{ runner.temp }}/tt-edition-artifacts/terminal-tree-standard-preview.tar.gz
          if-no-files-found: error
      - name: Upload verified Paranoid preview identity build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-tree-paranoid-preview
          path: ${{ runner.temp }}/tt-edition-artifacts/terminal-tree-paranoid-preview.tar.gz
          if-no-files-found: error
