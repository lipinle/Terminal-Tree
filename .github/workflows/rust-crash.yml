name: Rust virtual crash consistency

on:
  push:
    branches: ['release-candidate/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ext4-power-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [file, tree]
        group: [transfer-trash, restore-purge]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned Python compatibility reference
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/tt-python-reference"
          mkdir -p "$reference"
          git fetch --no-tags --depth=1 origin da145f5b0799b1958cba09ca95c57c9bb2f3fede
          git show da145f5b0799b1958cba09ca95c57c9bb2f3fede:legacy/python/src/tree.py > "$reference/tree.py"
          test "$(git hash-object "$reference/tree.py")" = 3101ff8b3fdbbe0561c28a59f915ab751240e8a9
          echo "TT_PYTHON_REFERENCE=$reference" >> "$GITHUB_ENV"
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compile native crash probe
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --features crash-probe --bin tt-crash-probe
      - name: Install VM tools and generic guest kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static linux-image-virtual kmod cpio zstd xz-utils e2fsprogs python3
      - name: Build isolated guest
        run: |
          set -euo pipefail
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -printf '%f\n' | sort -V | tail -n1)
          test -n "$kernel"
          version=${kernel#vmlinuz-}
          sudo chmod a+r "/boot/$kernel"
          bash tests/crash/build_guest.sh "$version" "$RUNNER_TEMP/tt-initramfs.gz" rust/target/release/tt-crash-probe
          echo "TT_KERNEL=/boot/$kernel" >> "$GITHUB_ENV"
      - name: Abrupt virtual power cuts and ext4 journal replay
        run: |
          set -euo pipefail
          if [[ "$TT_GROUP" == transfer-trash ]]; then
            cases=(copy-partial copy-before-publish copy-before-sync copy-after-sync copy-done move-before-sync move-after-sync move-done trash-journal trash-info-synced trash-before-sync trash-after-sync trash-done)
          else
            cases=(restore-journal restore-before-sync restore-after-sync restore-info-before-sync restore-info-after-sync restore-done purge-journal purge-entry-before-sync purge-entry-after-sync purge-data-synced purge-info-before-sync purge-info-after-sync purge-done)
          fi
          test "${#cases[@]}" -eq 13
          # Verify the complete matrix covers the harness exactly once.
          python3 - <<'PY'
          import re, runpy
          from pathlib import Path
          ns = runpy.run_path("tests/crash/run_vm_tests.py")
          groups = re.findall(r"^\s+cases=\(([^)]+)\)", Path(".github/workflows/rust-crash.yml").read_text(), re.M)
          all_cases = [case for group in groups for case in group.split()]
          assert len(groups) == 2 and all(len(g.split()) == 13 for g in groups)
          assert sorted(all_cases) == sorted(ns["CASES"] + ns["PERSONAL_CASES"])
          PY
          args=()
          for case in "${cases[@]}"; do args+=(--case "$case"); done
          python3 tests/crash/run_vm_tests.py --kernel "$TT_KERNEL" --initrd "$RUNNER_TEMP/tt-initramfs.gz" --logs "$RUNNER_TEMP/tt-crash-logs" --engine rust --fixture "$TT_FIXTURE" "${args[@]}"
        env:
          TT_FIXTURE: ${{ matrix.fixture }}
          TT_GROUP: ${{ matrix.group }}
      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-crash-serial-logs-${{ matrix.fixture }}-${{ matrix.group }}
          path: ${{ runner.temp }}/tt-crash-logs/
          if-no-files-found: warn
