name: Rust development
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compile and test native Rust
        run: cargo test --locked --manifest-path rust/Cargo.toml --features native-ops
      - name: Validate shell script syntax
        run: |
          for script in rust/*.sh; do bash -n "$script"; done
