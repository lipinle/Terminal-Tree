name: Rust development
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compile and test native Rust
        run: cargo test --locked --manifest-path rust/Cargo.toml --features native-ops
      - name: Install companion tools for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends eza 7zip git xvfb xauth xterm xdotool imagemagick fonts-dejavu-core nano
      - name: Verify companion tools on disposable fixtures
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --features native-ops --test external_tools -- --ignored
          cargo test --locked --manifest-path rust/Cargo.toml --features native-ops --lib git_manager::tests::local_workflow -- --ignored
      - name: Exercise application shell through PTY
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree
          python3 tests/benchmark/app.py rust/target/debug/terminal-tree
          cargo test --locked --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree pty_shell::tests::nano_fullscreen_smoke -- --ignored
      - name: Build and test optional visual preview
        run: |
          rustup run stable cargo test --manifest-path visual-preview/Cargo.toml
          rustup run stable cargo build --manifest-path visual-preview/Cargo.toml
          python3 tests/benchmark/visual_preview.py visual-preview/target/debug/tt-visual-preview
          TT_TEST_VISUAL_PREVIEW=1 TT_TEST_VISUAL_HELPER="$PWD/visual-preview/target/debug/tt-visual-preview" python3 tests/benchmark/app.py rust/target/debug/terminal-tree
          rustup run stable cargo metadata --manifest-path visual-preview/Cargo.toml --format-version 1 > /tmp/tt-visual-dependencies.json
          python3 -c 'import json; d=json.load(open("/tmp/tt-visual-dependencies.json")); print("\\n".join(sorted(p["name"]+" "+p["version"]+" "+str(p["license"]) for p in d["packages"])))'
      - name: Test optional X11 overlay
        run: |
          cargo test --manifest-path x11-overlay/Cargo.toml
          xvfb-run -a cargo test --manifest-path x11-overlay/Cargo.toml -- --ignored
          cargo metadata --manifest-path x11-overlay/Cargo.toml --format-version 1 > /tmp/tt-x11-dependencies.json
          python3 -c 'import json; d=json.load(open("/tmp/tt-x11-dependencies.json")); print("\\n".join(sorted(p["name"]+" "+p["version"]+" "+str(p["license"]) for p in d["packages"])))'
      - name: Validate shell script syntax
        run: |
          for script in rust/*.sh; do bash -n "$script"; done
      - name: Package UX preview for side-by-side testing
        run: |
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree
          TT_TEST_VISUAL_PREVIEW=1 TT_TEST_VISUAL_HELPER="$PWD/visual-preview/target/debug/tt-visual-preview" python3 tests/benchmark/app.py rust/target/release/terminal-tree
          mkdir -p preview-dist/payload
          install -m 755 rust/target/release/terminal-tree preview-dist/payload/terminal-tree
          cp LICENSE README.md ICON-NOTICES.md OPTIONAL-TOOLS.md preview-dist/payload/
          git rev-parse HEAD > preview-dist/payload/BUILD-COMMIT
          printf '%s\n' 'Experimental UX preview; not a stable release. Keep existing installation intact.' 'Run: TT_APP_CONFIG_DIR="$HOME/.config/terminal-tree-ux-preview" ./terminal-tree --app "$HOME"' 'Visual preview helper is not bundled; build separately from source pending license audit.' > preview-dist/payload/TESTING.txt
          tar -czf preview-dist/terminal-tree-ux-preview-linux-x86_64.tar.gz -C preview-dist/payload .
          (cd preview-dist && sha256sum terminal-tree-ux-preview-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Capture actual application screenshot
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash tests/benchmark/screenshot.sh rust/target/release/terminal-tree preview-dist/terminal-tree-screenshot.png
          sha256sum preview-dist/terminal-tree-screenshot.png
      - name: Upload UX preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-tree-ux-preview-linux-x86_64
          path: |
            preview-dist/terminal-tree-ux-preview-linux-x86_64.tar.gz
            preview-dist/SHA256SUMS
            preview-dist/terminal-tree-screenshot.png
          if-no-files-found: error
          retention-days: 14
