name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax and safety tests
        run: |
          python3 -m py_compile src/tree.py install.py
          for script in install.sh uninstall.sh shell/integration.sh archive/patches/installers/*.sh archive/patches/fixes/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s tests -v
      - name: Install, upgrade and legacy migration
        shell: bash
        run: |
          set -euo pipefail
          for legacy in fresh original-tree print-branch; do
            testhome=$(mktemp -d)
            printf '# unrelated settings\nexport SAMPLE=ok\n' > "$testhome/.bashrc"
            if [[ "$legacy" != fresh ]]; then
              cat "archive/legacy/$legacy.sh" >> "$testhome/.bashrc"
              printf '\n' >> "$testhome/.bashrc"
            fi
            cp "$testhome/.bashrc" "$testhome/before"
            export HOME="$testhome" XDG_DATA_HOME="$testhome/data" XDG_CONFIG_HOME="$testhome/config"
            bash install.sh
            cmp src/tree.py "$XDG_DATA_HOME/terminal-tree/tree.py"
            bash install.sh
            cmp src/tree.py "$XDG_DATA_HOME/terminal-tree/tree.py"
            bash uninstall.sh
            grep -q 'export SAMPLE=ok' "$HOME/.bashrc"
            if [[ "$legacy" != fresh ]]; then
              cmp "$HOME/before" "$HOME/.bashrc"
            fi
            if grep -q 'terminal-tree managed' "$HOME/.bashrc"; then
              exit 1
            fi
          done
