name: Rust compatibility
on:
  push:
    branches: ['release-candidate/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build and test native runtime
        run: |
          uname -a
          ldd --version
          # Synthetic homes must not inherit the host's XDG paths.
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME cargo test --locked --manifest-path rust/Cargo.toml --features native-ops
          cargo build --locked --release --manifest-path rust/Cargo.toml --features native-ops --bin terminal-tree
      - name: Terminal help, navigation and persistence
        run: |
          python3 tests/benchmark/help.py rust/target/release/terminal-tree
          python3 tests/benchmark/ui_tools.py rust/target/release/terminal-tree
  real-filesystems:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, xfs, btrfs, exfat]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install filesystem utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs xfsprogs btrfs-progs exfatprogs
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Verify operations on isolated loop filesystem
        env:
          TT_FS: ${{ matrix.filesystem }}
        run: bash tests/compat/filesystem.sh "$TT_FS"

  portable-read-only:
    strategy:
      fail-fast: false
      matrix:
        # macOS validation deferred; hosted jobs repeatedly cancelled.
        runner: [windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build shared read-only model and UI
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --no-default-features
          cargo run --locked --manifest-path rust/Cargo.toml --no-default-features --bin terminal-tree -- --list .
