name: Rust code quality
on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-quality.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-quality.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select reproducible lint toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Check rustfmt
        run: cargo +1.100.0 fmt --manifest-path rust/Cargo.toml --all -- --check
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select reproducible lint toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Cache Cargo registry downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Check all targets
        run: cargo +1.100.0 clippy --locked --manifest-path rust/Cargo.toml --all-targets --${{ matrix.features }} -- -D warnings
