name: Rust code quality
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-quality.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select reproducible lint toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Check rustfmt
        run: cargo +1.100.0 fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Prepare mechanical formatting for the initial cleanup
        if: failure() && github.ref == 'refs/heads/code-quality'
        run: |
          cargo +1.100.0 fmt --manifest-path rust/Cargo.toml --all
          python3 - <<'PY'
          import base64, subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z", "--", "rust"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              assert path.suffix == ".rs" and path.is_file()
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              for i in range(0, len(data), 2048):
                  print("TT_FMT", path.as_posix(), i // 2048, data[i:i+2048], flush=True)
          PY
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select reproducible lint toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Check all targets
        run: cargo +1.100.0 clippy --locked --manifest-path rust/Cargo.toml --all-targets --${{ matrix.features }} -- -D warnings
